<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지능을 전기처럼 쓰는 시대 — AI 네이티브 핸드북 2026</title>
<style>
  :root { --paper: #efe9dc; --ink: #1f2a3a; --soft: #4a5566; --accent: #b8432f; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.7; word-break: keep-all; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 56px; }
  img.cover { width: 200px; max-width: 60%; display: block; margin-bottom: 24px; box-shadow: 0 6px 20px rgba(31,42,58,.18); }
  h1 { font-size: 1.5rem; line-height: 1.4; margin: 0 0 4px; }
  .meta { color: var(--soft); font-size: .95rem; margin: 0 0 28px; }
  a.btn { display: block; padding: 14px 18px; margin: 10px 0; border: 2px solid var(--ink); border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 700; }
  a.btn small { display: block; font-weight: 400; color: var(--soft); }
  a.btn.primary { background: var(--ink); color: var(--paper); }
  a.btn.primary small { color: #c9c0ad; }
  video { width: 100%; border-radius: 10px; margin: 4px 0 6px; background: #0e131b; box-shadow: 0 6px 20px rgba(31,42,58,.18); }
  .vcap { color: var(--soft); font-size: .9rem; margin: 0 0 22px; }
  .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; width: min(980px, calc(100vw - 32px)); margin-left: 50%; transform: translateX(-50%); }
  .videos figure { margin: 0; }
  @media (max-width: 720px) { .videos { grid-template-columns: 1fr; } }
  footer { margin-top: 36px; font-size: .85rem; color: var(--soft); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="cover" src="cover.jpg" alt="표지">
  <h1>지능을 전기처럼 쓰는 시대<br>AI 네이티브 핸드북 2026</h1>
  <p class="meta">전종홍 지음 · 계속 고쳐 펴내는 살아 있는 문서</p>
  <div class="videos">
    <figure>
      <video id="trailer" controls playsinline preload="metadata" poster="trailer-poster.jpg" src="trailer.mp4"></video>
      <p class="vcap">소개 영상(77초) — 지능 에너지 시대로의 변화, 이 책이 그 변화를 읽는 방법, 그리고 오픈소스 북으로 나누는 까닭</p>
    </figure>
    <figure>
      <video id="trailer2" controls playsinline preload="metadata" poster="trailer2-poster.jpg" src="trailer2.mp4"></video>
      <p class="vcap">제6·7부 미리 보기(64초) — 에이전트가 만드는 세상과 지능 에너지 사회, 2030년 그 내일의 모습</p>
    </figure>
  </div>
  <a class="btn primary" href="book.pdf">PDF 열기<small>인쇄용 판형</small></a>
  <a class="btn" href="book.epub" download="ai-native-handbook-2026.epub">EPUB 내려받기<small>전자책 단말기·앱</small></a>
  <a class="btn" href="https://github.com/hollobit/ai-native">판 이력·지난 판<small>GitHub 저장소</small></a>
  <footer>
    <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ko"><img src="https://licensebuttons.net/l/by-nc-nd/4.0/88x31.png" alt="CC BY-NC-ND 4.0" width="88" height="31"></a><br>
    이 책은 크리에이티브 커먼즈 저작자표시-비영리-변경금지 4.0 국제 라이선스(CC BY-NC-ND 4.0)를 따릅니다.
  </footer>
</main>
</body>
</html>
